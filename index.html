<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>GZ8 — Nairobi Street Fashion</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow+Condensed:ital,wght@0,300;0,400;0,600;0,700;0,900;1,700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
/* YOUR ORIGINAL BRAND IDENTITY */
:root {
  --black: #080808;
  --dark: #111111;
  --card: #1a1a1a;
  --border: #2a2a2a;
  --red: #E8002D;
  --gold: #F5B800;
  --white: #F4F0E8;
  --muted: #888;
  --font-display: 'Bebas Neue', cursive;
  --font-body: 'Barlow Condensed', sans-serif;
  --font-mono: 'Space Mono', monospace;
}

*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
body { background: var(--black); color: var(--white); font-family: var(--font-body); overflow-x: hidden; width: 100%; }

/* TOP NAV - RESTORED ORIGINAL STYLE */
#topnav {
  position: fixed; top: 0; left: 0; right: 0; z-index: 1000;
  background: rgba(8,8,8,0.95); backdrop-filter: blur(20px);
  border-bottom: 1px solid var(--border); display: flex;
  align-items: center; justify-content: space-between;
  padding: 0 20px; height: 60px;
}
.nav-logo { font-family: var(--font-display); font-size: 32px; letter-spacing: 3px; }
.nav-logo span { color: var(--red); }

/* HERO SECTION */
#landing-hero { min-height: 85vh; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; padding-top: 60px; }
.hero-title { font-family: var(--font-display); font-size: clamp(80px, 20vw, 180px); line-height: 0.8; letter-spacing: 5px; }
.hero-title .red { color: var(--red); }

/* TICKER */
.ticker-wrap { border-top: 1px solid var(--border); border-bottom: 1px solid var(--border); padding: 15px 0; background: var(--dark); margin: 20px 0; overflow: hidden; width: 100%; }
.ticker { display: flex; white-space: nowrap; animation: ticker 30s linear infinite; }
.ticker-item { font-family: var(--font-display); font-size: 16px; letter-spacing: 4px; color: var(--muted); padding: 0 40px; }
@keyframes ticker { from { transform: translateX(0); } to { transform: translateX(-50%); } }

/* STORE GRID - YOUR ORIGINAL ARRANGEMENT */
.section-title { font-family: var(--font-display); font-size: 42px; padding: 40px 20px 10px; letter-spacing: 2px; text-align: left; }
.products-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 2px; padding: 0 2px; background: var(--border); }
.product-card { background: var(--black); transition: 0.3s; position: relative; border: 1px solid var(--border); }
.card-img { width: 100%; height: 420px; object-fit: cover; filter: grayscale(20%); transition: 0.5s; }
.product-card:hover .card-img { filter: grayscale(0%); }
.card-body { padding: 25px; text-align: center; }
.card-name { font-family: var(--font-display); font-size: 26px; letter-spacing: 1px; margin-bottom: 5px; }
.card-price { font-family: var(--font-mono); color: var(--gold); margin-bottom: 20px; font-size: 18px; }

/* BUY BUTTON */
.btn-add { 
    background: var(--white); color: var(--black); border: none; 
    font-family: var(--font-display); font-size: 18px; padding: 15px; 
    width: 100%; cursor: pointer; transition: 0.2s; letter-spacing: 2px;
}
.btn-add:hover { background: var(--red); color: white; }

/* THE FIXED BASKET BUTTON - NOW VISIBLE ON ALL PHONES */
#basket-toggle {
    position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%);
    z-index: 2000; background: var(--red); color: white; border: none;
    padding: 18px 40px; font-family: var(--font-display); font-size: 20px;
    border-radius: 50px; cursor: pointer; box-shadow: 0 15px 40px rgba(232,0,45,0.5);
    display: none; animation: popUp 0.3s ease-out; letter-spacing: 2px;
}
@keyframes popUp { from { bottom: -50px; } to { bottom: 30px; } }

/* BASKET PANEL - SLICK RIGHT SIDEBAR */
#basket-panel {
    position: fixed; top: 0; right: -100%; width: 100%; max-width: 450px; height: 100%;
    background: var(--dark); z-index: 3000; transition: 0.4s cubic-bezier(0.7, 0, 0.3, 1);
    border-left: 1px solid var(--border); display: flex; flex-direction: column;
}
#basket-panel.active { right: 0; }
.basket-header { padding: 30px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
.basket-items { flex: 1; overflow-y: auto; padding: 20px; }
.basket-item { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; background: #151515; padding: 20px; border-bottom: 1px solid var(--border); }
.basket-footer { padding: 30px; background: var(--black); border-top: 1px solid var(--border); }
.total-row { display: flex; justify-content: space-between; font-family: var(--font-display); font-size: 32px; margin-bottom: 25px; color: var(--gold); }
.btn-whatsapp { 
    background: #25D366; color: white; width: 100%; padding: 22px; 
    font-family: var(--font-display); font-size: 24px; text-decoration: none; 
    display: block; text-align: center; letter-spacing: 2px;
}

@media (max-width: 768px) {
    .products-grid { grid-template-columns: 1fr 1fr; }
    .card-img { height: 280px; }
    .hero-title { font-size: 90px; }
}
</style>
</head>
<body>

<nav id="topnav">
  <div class="nav-logo">GZ<span>8</span></div>
  <div style="font-family: var(--font-mono); font-size: 12px; color: var(--gold);">NRB.254</div>
</nav>

<section id="landing-hero">
  <div class="hero-title">GZ<span class="red">8</span><br>STUDIO</div>
  <div class="ticker-wrap">
    <div class="ticker">
      <div class="ticker-item">NEW DROP LIVE</div>
      <div class="ticker-item">NAIROBI STREETWEAR</div>
      <div class="ticker-item">THE VAULT IS OPEN</div>
      <div class="ticker-item">LIMITLESS DRIP</div>
      <div class="ticker-item">NEW DROP LIVE</div>
    </div>
  </div>
</section>

<h2 class="section-title">THE STORE</h2>
<div id="store" class="products-grid">
    </div>

<button id="basket-toggle" onclick="toggleBasket()">VIEW BASKET [<span id="basket-count">0</span>]</button>

<div id="basket-panel">
  <div class="basket-header">
    <h2 style="font-family: var(--font-display); letter-spacing: 3px; font-size: 32px;">YOUR BASKET</h2>
    <button onclick="toggleBasket()" style="background:none; border:none; color:white; font-size:40px; cursor:pointer;">&times;</button>
  </div>
  <div class="basket-items" id="basket-list">
    </div>
  <div class="basket-footer">
    <div class="total-row">
      <span>TOTAL</span>
      <span id="basket-total">KSH 0</span>
    </div>
    <button onclick="sendOrder()" class="btn-whatsapp">PLACE ORDER ON WHATSAPP</button>
  </div>
</div>

<script>
// BACKEND CONFIG
const SUPABASE_URL = "https://cegqucyibtgddntbwahn.supabase.co";
const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNlZ3F1Y3lpYnRnZGRudGJ3YWhuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzgxMzY5MzIsImV4cCI6MjA5MzcxMjkzMn0.mxsdS_P_Dpsl9s6qHScBEo5ZEVl4linidceLifUFqHE";
const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let basket = [];

async function initStore() {
    const { data, error } = await _supabase.from('products').select('*').order('id', { ascending: false });
    if (error) return;

    const grid = document.getElementById('store');
    grid.innerHTML = ''; 
    
    data.forEach(item => {
        grid.innerHTML += `
            <div class="product-card">
                <img src="${item.img || item.image_url}" class="card-img" alt="${item.name}">
                <div class="card-body">
                    <div class="card-name">${item.name}</div>
                    <div class="card-price">KSH ${Number(item.price).toLocaleString()}</div>
                    <button class="btn-add" onclick="addToBasket('${item.name}', ${item.price})">ADD TO BASKET</button>
                </div>
            </div>
        `;
    });
}

function addToBasket(name, price) {
    basket.push({ name, price });
    renderBasket();
    document.getElementById('basket-toggle').style.display = 'block';
}

function toggleBasket() {
    document.getElementById('basket-panel').classList.toggle('active');
}

function renderBasket() {
    const list = document.getElementById('basket-list');
    const totalEl = document.getElementById('basket-total');
    const countEl = document.getElementById('basket-count');
    
    list.innerHTML = '';
    let total = 0;
    
    basket.forEach((item, index) => {
        total += item.price;
        list.innerHTML += `
            <div class="basket-item">
                <div>
                    <div style="font-family: var(--font-display); font-size: 20px; letter-spacing:1px;">${item.name}</div>
                    <div style="color:var(--gold); font-family: var(--font-mono);">KSH ${item.price.toLocaleString()}</div>
                </div>
                <button onclick="removeFromBasket(${index})" style="background:none; border:none; color:var(--red); cursor:pointer; font-family: var(--font-display);">REMOVE</button>
            </div>
        `;
    });

    totalEl.innerText = `KSH ${total.toLocaleString()}`;
    countEl.innerText = basket.length;
}

function removeFromBasket(index) {
    basket.splice(index, 1);
    renderBasket();
    if (basket.length === 0) {
        document.getElementById('basket-toggle').style.display = 'none';
        toggleBasket();
    }
}

function sendOrder() {
    const myNumber = "254118359925";
    let message = "*NEW GZ8 ORDER*%0A-----------------------%0A";
    
    basket.forEach((item, i) => {
        message += `${i+1}. ${item.name} - KSH ${item.price.toLocaleString()}%0A`;
    });
    
    const grandTotal = basket.reduce((acc, curr) => acc + curr.price, 0);
    message += "-----------------------%0A";
    message += `*TOTAL: KSH ${grandTotal.toLocaleString()}*%0A%0A_Please confirm my order._`;
    
    window.open(`https://wa.me/${myNumber}?text=${message}`, '_blank');
}

window.onload = initStore;
</script>

</body>
</html>
