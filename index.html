<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GZ8 — Nairobi Street Fashion</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow+Condensed:ital,wght@0,300;0,400;0,600;0,700;0,900;1,700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
/* YOUR ORIGINAL BRAND COLORS & FONTS */
:root {
  --black: #080808;
  --dark: #111111;
  --card: #1a1a1a;
  --border: #2a2a2a;
  --red: #E8002D;
  --gold: #F5B800;
  --white: #F4F0E8;
  --muted: #888;
  --font-display: 'Bebas Neue', cursive;
  --font-body: 'Barlow Condensed', sans-serif;
  --font-mono: 'Space Mono', monospace;
}

*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
body { background: var(--black); color: var(--white); font-family: var(--font-body); overflow-x: hidden; }

/* NAV */
#topnav {
  position: fixed; top: 0; left: 0; right: 0; z-index: 1000;
  background: rgba(8,8,8,0.9); backdrop-filter: blur(15px);
  border-bottom: 1px solid var(--border); display: flex;
  align-items: center; justify-content: space-between;
  padding: 0 20px; height: 60px;
}
.nav-logo { font-family: var(--font-display); font-size: 32px; letter-spacing: 3px; }
.nav-logo span { color: var(--red); }

/* HERO */
#landing-hero { min-height: 90vh; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; padding-top: 60px; }
.hero-title { font-family: var(--font-display); font-size: clamp(80px, 20vw, 180px); line-height: 0.8; letter-spacing: 5px; }
.hero-title .red { color: var(--red); }

/* TICKER */
.ticker-wrap { border-top: 1px solid var(--border); border-bottom: 1px solid var(--border); overflow: hidden; padding: 15px 0; background: var(--dark); margin: 40px 0; }
.ticker { display: flex; white-space: nowrap; animation: ticker 25s linear infinite; }
.ticker-item { font-family: var(--font-display); font-size: 16px; letter-spacing: 4px; color: var(--muted); padding: 0 30px; }
@keyframes ticker { from { transform: translateX(0); } to { transform: translateX(-50%); } }

/* STORE GRID */
.section-title { font-family: var(--font-display); font-size: 40px; padding: 0 20px; margin-top: 40px; letter-spacing: 2px; }
.products-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 25px; padding: 20px; }
.product-card { background: var(--card); border: 1px solid var(--border); transition: 0.3s; position: relative; }
.product-card:hover { border-color: var(--gold); transform: translateY(-5px); }
.card-img { width: 100%; height: 380px; object-fit: cover; }
.card-body { padding: 20px; text-align: center; }
.card-name { font-family: var(--font-display); font-size: 24px; letter-spacing: 1px; margin-bottom: 5px; }
.card-price { font-family: var(--font-mono); color: var(--gold); margin-bottom: 15px; }
.btn-add { background: var(--white); color: var(--black); border: none; font-family: var(--font-display); font-size: 18px; padding: 10px 20px; width: 100%; cursor: pointer; transition: 0.2s; }
.btn-add:hover { background: var(--red); color: white; }

/* BASKET FLOATING BUTTON */
#basket-toggle {
    position: fixed; bottom: 20px; right: 20px; z-index: 2000;
    background: var(--red); color: white; border: none; padding: 15px 25px;
    font-family: var(--font-display); font-size: 20px; border-radius: 5px;
    cursor: pointer; box-shadow: 0 10px 30px rgba(232,0,45,0.4);
    display: none; /* Only shows when items are added */
}

/* BASKET PANEL */
#basket-panel {
    position: fixed; top: 0; right: -100%; width: 100%; max-width: 400px; height: 100%;
    background: var(--dark); z-index: 3000; transition: 0.4s ease;
    border-left: 1px solid var(--border); display: flex; flex-direction: column;
}
#basket-panel.active { right: 0; }
.basket-header { padding: 20px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
.basket-items { flex: 1; overflow-y: auto; padding: 20px; }
.basket-item { display: flex; justify-content: space-between; margin-bottom: 20px; padding-bottom: 10px; border-bottom: 1px solid #222; }
.basket-footer { padding: 30px 20px; border-top: 1px solid var(--border); background: var(--black); }
.total-row { display: flex; justify-content: space-between; font-family: var(--font-display); font-size: 28px; margin-bottom: 20px; }
.btn-order { background: #25D366; color: white; width: 100%; padding: 20px; font-family: var(--font-display); font-size: 22px; text-decoration: none; display: block; text-align: center; border-radius: 4px; }
</style>
</head>
<body>

<nav id="topnav">
  <div class="nav-logo">GZ<span>8</span></div>
</nav>

<section id="landing-hero">
  <div class="hero-title">GZ<span class="red">8</span><br>STUDIO</div>
  <div class="ticker-wrap">
    <div class="ticker">
      <div class="ticker-item">NAIROBI STREETWEAR</div>
      <div class="ticker-item">DROP 001 LIVE</div>
      <div class="ticker-item">STREET CULTURE</div>
      <div class="ticker-item">NAIROBI STREETWEAR</div>
      <div class="ticker-item">DROP 001 LIVE</div>
    </div>
  </div>
</section>

<h2 class="section-title">FEATURED DROPS</h2>
<div id="store" class="products-grid">
  </div>

<button id="basket-toggle" onclick="toggleBasket()">BASKET (<span id="basket-count">0</span>)</button>

<div id="basket-panel">
  <div class="basket-header">
    <h2 style="font-family: var(--font-display); letter-spacing: 2px;">YOUR BASKET</h2>
    <button onclick="toggleBasket()" style="background:none; border:none; color:white; font-size:30px; cursor:pointer;">×</button>
  </div>
  <div class="basket-items" id="basket-list">
    </div>
  <div class="basket-footer">
    <div class="total-row">
      <span>TOTAL</span>
      <span id="basket-total">KES 0</span>
    </div>
    <button onclick="placeOrder()" class="btn-order">PLACE ORDER VIA WHATSAPP</button>
  </div>
</div>

<script>
const SUPABASE_URL = 'https://cegqucyibtgddntbwahn.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNlZ3F1Y3lpYnRnZGRudGJ3YWhuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzgxMzY5MzIsImV4cCI6MjA5MzcxMjkzMn0.mxsdS_P_Dpsl9s6qHScBEo5ZEVl4linidceLifUFqHE';
const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let basket = [];

// 1. FETCH FROM SUPABASE
async function loadProducts() {
    const { data, error } = await _supabase.from('products').select('*').order('id', { ascending: false });
    if (error) return console.error(error);

    const grid = document.getElementById('store');
    grid.innerHTML = '';
    data.forEach(p => {
        grid.innerHTML += `
            <div class="product-card">
                <img src="${p.image_url}" class="card-img" alt="${p.name}">
                <div class="card-body">
                    <div class="card-name">${p.name}</div>
                    <div class="card-price">KES ${Number(p.price).toLocaleString()}</div>
                    <button class="btn-add" onclick="addToBasket('${p.name}', ${p.price})">ADD TO BASKET</button>
                </div>
            </div>
        `;
    });
}

// 2. BASKET LOGIC
function addToBasket(name, price) {
    basket.push({ name, price });
    updateBasketUI();
    document.getElementById('basket-toggle').style.display = 'block';
}

function toggleBasket() {
    document.getElementById('basket-panel').classList.toggle('active');
}

function updateBasketUI() {
    const list = document.getElementById('basket-list');
    const count = document.getElementById('basket-count');
    const total = document.getElementById('basket-total');
    
    list.innerHTML = '';
    let sum = 0;
    
    basket.forEach((item, index) => {
        sum += item.price;
        list.innerHTML += `
            <div class="basket-item">
                <span>${item.name}</span>
                <span>KES ${item.price.toLocaleString()}</span>
            </div>
        `;
    });

    count.innerText = basket.length;
    total.innerText = `KES ${sum.toLocaleString()}`;
}

// 3. WHATSAPP ORDER LOGIC
function placeOrder() {
    const phone = "254118359925";
    let message = "HELO GZ8 STUDIO, I WANT TO ORDER:%0A%0A";
    
    basket.forEach(item => {
        message += `- ${item.name} (KES ${item.price.toLocaleString()})%0A`;
    });
    
    const total = basket.reduce((a, b) => a + b.price, 0);
    message += `%0A*TOTAL: KES ${total.toLocaleString()}*%0A%0APlease assist with payment and delivery.`;
    
    window.open(`https://wa.me/${phone}?text=${message}`, '_blank');
}

window.onload = loadProducts;
</script>

</body>
</html>
