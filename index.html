<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GZ8 — Nairobi Street Fashion</title>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow+Condensed:wght@300;400;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
    
    <!-- Supabase Library -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        :root {
            --black: #080808; --dark: #111111; --card: #1a1a1a; --border: #2a2a2a;
            --red: #E8002D; --gold: #F5B800; --white: #F4F0E8; --muted: #888;
            --font-display: 'Bebas Neue', cursive; --font-body: 'Barlow Condensed', sans-serif;
        }

        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: var(--black); color: var(--white); font-family: var(--font-body); overflow-x: hidden; }

        /* Navigation */
        #topnav {
            position: fixed; top: 0; left: 0; right: 0; z-index: 1000;
            background: rgba(8,8,8,0.95); backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border); display: flex; 
            align-items: center; justify-content: space-between; padding: 0 20px; height: 56px;
        }
        .nav-logo { font-family: var(--font-display); font-size: 30px; letter-spacing: 3px; cursor: pointer; }
        .nav-logo span { color: var(--red); }
        .nav-center { display: flex; gap: 15px; }
        .nav-link { color: var(--muted); text-transform: uppercase; font-weight: 700; font-size: 11px; cursor: pointer; background: none; border: none; }
        .nav-link.active { color: var(--white); }

        /* Hero */
        .hero { height: 60vh; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; background: radial-gradient(circle at center, #1a0000 0%, #080808 100%); }
        .hero-title { font-family: var(--font-display); font-size: 80px; line-height: 1; margin-bottom: 10px; }

        /* Products */
        .products-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 2px; padding: 20px; }
        .product-card { background: var(--card); border: 1px solid var(--border); position: relative; padding: 10px; }
        .card-img { width: 100%; height: 300px; object-fit: cover; border-radius: 4px; }
        .card-name { font-family: var(--font-display); font-size: 24px; margin-top: 10px; }
        .card-price { color: var(--gold); font-weight: bold; }
        .order-btn { width: 100%; background: #25D366; color: white; border: none; padding: 10px; margin-top: 10px; font-weight: bold; cursor: pointer; }

        /* Admin */
        .admin-section { padding: 40px; max-width: 800px; margin: 0 auto; display: none; }
        .admin-section.active { display: block; }
        input, select, textarea { width: 100%; background: #000; border: 1px solid var(--border); color: #fff; padding: 12px; margin-bottom: 10px; }
        .btn-gold { background: var(--gold); color: #000; border: none; padding: 15px; font-weight: 700; cursor: pointer; width: 100%; }
    </style>
</head>
<body>

    <nav id="topnav">
        <div class="nav-logo">GZ<span>8</span></div>
        <div class="nav-center">
            <button class="nav-link active" id="shop-tab" onclick="toggleView('shop')">SHOP</button>
            <button class="nav-link" id="admin-tab" onclick="toggleView('admin')">ADMIN</button>
        </div>
    </nav>

    <div id="shop-view">
        <section class="hero">
            <h1 class="hero-title">STREET <span style="color:var(--red)">DROPS</span></h1>
            <p style="letter-spacing: 5px; color: var(--muted)">NAIROBI, KENYA</p>
        </section>
        <div id="products-grid" class="products-grid"></div>
    </div>

    <div id="admin-view" class="admin-section">
        <h2 style="font-family: var(--font-display); font-size: 40px; margin-bottom: 20px;">UPLOAD NEW DROP</h2>
        <input type="text" id="p-name" placeholder="PRODUCT NAME">
        <input type="number" id="p-price" placeholder="PRICE (KSH)">
        <select id="p-section">
            <option value="NEW ARRIVAL">NEW ARRIVAL</option>
            <option value="LIMITED DROP">LIMITED DROP</option>
        </select>
        <textarea id="p-desc" placeholder="DESCRIPTION"></textarea>
        <input type="file" id="p-image" accept="image/*">
        <button class="btn-gold" id="upload-btn" onclick="handleUpload()">PUSH TO CLOUD</button>
    </div>

    <script>
        const SUPABASE_URL = 'https://cegqucyibtgddntbwahn.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNlZ3F1Y3lpYnRnZGRudGJ3YWhuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzgxMzY5MzIsImV4cCI6MjA5MzcxMjkzMn0.mxsdS_P_Dpsl9s6qHScBEo5ZEVl4linidceLifUFqHE';
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        function toggleView(view) {
            if(view === 'admin') {
                document.getElementById('shop-view').style.display = 'none';
                document.getElementById('admin-view').style.display = 'block';
                document.getElementById('admin-tab').classList.add('active');
                document.getElementById('shop-tab').classList.remove('active');
            } else {
                document.getElementById('shop-view').style.display = 'block';
                document.getElementById('admin-view').style.display = 'none';
                document.getElementById('shop-tab').classList.add('active');
                document.getElementById('admin-tab').classList.remove('active');
            }
        }

        async function loadDrops() {
            const { data, error } = await _supabase.from('products').select('*').order('id', { ascending: false });
            const grid = document.getElementById('products-grid');
            grid.innerHTML = '';
            if (data) {
                data.forEach(item => {
                    grid.innerHTML += `
                        <div class="product-card">
                            <img src="${item.image_url}" class="card-img">
                            <div class="card-name">${item.name}</div>
                            <div class="card-price">KSH ${item.price.toLocaleString()}</div>
                            <button class="order-btn" onclick="orderWhatsApp('${item.name}')">ORDER VIA WHATSAPP</button>
                        </div>
                    `;
                });
            }
        }

        async function handleUpload() {
            const btn = document.getElementById('upload-btn');
            const file = document.getElementById('p-image').files[0];
            const name = document.getElementById('p-name').value;
            const price = document.getElementById('p-price').value;

            if(!file || !name) return alert("Missing info!");
            
            btn.innerText = "UPLOADING...";
            btn.disabled = true;

            const fileName = Date.now() + "_" + file.name;
            const { data: st, error: e1 } = await _supabase.storage.from('fashion-images').upload(fileName, file);
            
            if(e1) return alert(e1.message);

            const { data: url } = _supabase.storage.from('fashion-images').getPublicUrl(fileName);

            const { error: e2 } = await _supabase.from('products').insert([
                { name, price: parseInt(price), image_url: url.publicUrl, section: document.getElementById('p-section').value, description: document.getElementById('p-desc').value }
            ]);

            if(!e2) {
                alert("SUCCESS!");
                location.reload();
            } else {
                alert(e2.message);
                btn.innerText = "PUSH TO CLOUD";
                btn.disabled = false;
            }
        }

        function orderWhatsApp(name) {
            const phone = "254712345678"; // <--- CHANGE TO YOUR NUMBER
            const msg = encodeURIComponent("Hello GZ8, I want to order the " + name);
            window.open(`https://wa.me/${phone}?text=${msg}`, '_blank');
        }

        document.addEventListener('DOMContentLoaded', loadDrops);
    </script>
</body>
</html>
