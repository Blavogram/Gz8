<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GZ8 — Nairobi Street Fashion</title>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow+Condensed:wght@300;400;600;700;900&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
    
    <!-- Supabase Library -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        :root {
            --black: #080808; --dark: #111111; --card: #1a1a1a; --border: #2a2a2a;
            --red: #E8002D; --gold: #F5B800; --green: #00A550; --white: #F4F0E8;
            --muted: #888; --font-display: 'Bebas Neue', cursive;
            --font-body: 'Barlow Condensed', sans-serif; --font-mono: 'Space Mono', monospace;
        }

        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: var(--black); color: var(--white); font-family: var(--font-body); overflow-x: hidden; }

        /* Navigation */
        #topnav {
            position: fixed; top: 0; left: 0; right: 0; z-index: 1000;
            background: rgba(8,8,8,0.95); backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border); display: flex; 
            align-items: center; justify-content: space-between; padding: 0 20px; height: 56px;
        }
        .nav-logo { font-family: var(--font-display); font-size: 30px; letter-spacing: 3px; cursor: pointer; }
        .nav-logo span { color: var(--red); }
        .nav-center { display: flex; gap: 15px; }
        .nav-link { color: var(--muted); text-transform: uppercase; font-weight: 700; font-size: 11px; cursor: pointer; background: none; border: none; }
        .nav-link.active { color: var(--white); }

        /* Pages */
        .page { display: none; padding-top: 56px; min-height: 100vh; }
        .page.active { display: block; }

        /* Storefront */
        .products-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 2px; padding: 20px; }
        .product-card { background: var(--card); border: 1px solid var(--border); position: relative; }
        .card-img { width: 100%; height: 350px; object-fit: cover; }
        .card-body { padding: 15px; }
        .card-name { font-family: var(--font-display); font-size: 22px; margin-bottom: 5px; }
        .card-price { color: var(--gold); font-family: var(--font-mono); }

        /* Admin Styles */
        .admin-container { display: flex; padding: 40px; gap: 40px; flex-wrap: wrap; }
        .admin-form-box { background: var(--dark); padding: 30px; border: 1px solid var(--border); flex: 1; min-width: 300px; }
        input, select, textarea { width: 100%; background: #000; border: 1px solid var(--border); color: #fff; padding: 12px; margin-bottom: 15px; }
        .btn { padding: 12px 24px; cursor: pointer; border: none; font-weight: 700; text-transform: uppercase; }
        .btn-gold { background: var(--gold); color: #000; }
        
        .admin-table-box { flex: 2; min-width: 500px; }
        table { width: 100%; border-collapse: collapse; }
        th { text-align: left; color: var(--muted); padding: 10px; border-bottom: 1px solid var(--border); }
        td { padding: 10px; border-bottom: 1px solid #222; }
    </style>
</head>
<body>

    <nav id="topnav">
        <div class="nav-logo" onclick="showPage('landing')">GZ<span>8</span></div>
        <div class="nav-center">
            <button class="nav-link active" onclick="showPage('store')">SHOP</button>
            <button class="nav-link" onclick="showPage('admin')">ADMIN</button>
        </div>
    </nav>

    <!-- SHOP PAGE -->
    <div id="store-page" class="page active">
        <div id="products-grid" class="products-grid">
            <!-- Products will load here via Supabase -->
        </div>
    </div>

    <!-- ADMIN PAGE -->
    <div id="admin-page" class="page">
        <div class="admin-container">
            <div class="admin-form-box">
                <h2 style="font-family: var(--font-display); margin-bottom: 20px;">NEW DROP</h2>
                <input type="text" id="admin-p-name" placeholder="PRODUCT NAME">
                <input type="number" id="admin-p-price" placeholder="PRICE (KSH)">
                <select id="admin-p-section">
                    <option value="NEW ARRIVAL">NEW ARRIVAL</option>
                    <option value="LIMITED DROP">LIMITED DROP</option>
                    <option value="STREETWEAR">STREETWEAR</option>
                </select>
                <textarea id="admin-p-desc" placeholder="DESCRIPTION"></textarea>
                <label style="font-size: 10px; color: var(--gold);">PRODUCT IMAGE:</label>
                <input type="file" id="admin-p-image" accept="image/*">
                <button class="btn btn-gold" onclick="uploadProduct()">PUSH TO STORE</button>
            </div>

            <div class="admin-table-box">
                <table>
                    <thead>
                        <tr>
                            <th>IMG</th>
                            <th>NAME</th>
                            <th>PRICE</th>
                            <th>ACTION</th>
                        </tr>
                    </thead>
                    <tbody id="admin-products-list"></tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        // 1. SUPABASE CONNECTION
        const SUPABASE_URL = 'https://cegqucyibtgddntbwahn.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNlZ3F1Y3lpYnRnZGRudGJ3YWhuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzgxMzY5MzIsImV4cCI6MjA5MzcxMjkzMn0.mxsdS_P_Dpsl9s6qHScBEo5ZEVl4linidceLifUFqHE';
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        // 2. NAVIGATION LOGIC
        function showPage(pageId) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.getElementById(pageId + '-page').classList.add('active');
        }

        // 3. FETCH DATA FROM SUPABASE
        async function loadGZ8Products() {
            const { data, error } = await _supabase
                .from('products')
                .select('*')
                .order('id', { ascending: false });

            if (error) return console.error(error);
            renderUI(data);
        }

        // 4. RENDER UI
        function renderUI(products) {
            const grid = document.getElementById('products-grid');
            const adminList = document.getElementById('admin-products-list');
            
            grid.innerHTML = '';
            adminList.innerHTML = '';

            products.forEach(item => {
                // Customer Grid
                grid.innerHTML += `
                    <div class="product-card">
                        <img src="${item.image_url}" class="card-img">
                        <div class="card-body">
                            <p style="color:var(--red); font-size:10px;">${item.section}</p>
                            <h3 class="card-name">${item.name}</h3>
                            <p class="card-price">KSH ${item.price.toLocaleString()}</p>
                        </div>
                    </div>
                `;

                // Admin Table
                adminList.innerHTML += `
                    <tr>
                        <td><img src="${item.image_url}" width="40"></td>
                        <td>${item.name}</td>
                        <td>${item.price}</td>
                        <td><button onclick="deleteProduct(${item.id})" style="color:red; background:none; border:none; cursor:pointer;">DELETE</button></td>
                    </tr>
                `;
            });
        }

        // 5. UPLOAD LOGIC
        async function uploadProduct() {
            const name = document.getElementById('admin-p-name').value;
            const price = document.getElementById('admin-p-price').value;
            const section = document.getElementById('admin-p-section').value;
            const desc = document.getElementById('admin-p-desc').value;
            const file = document.getElementById('admin-p-image').files[0];

            if(!file || !name || !price) return alert("Fill all fields!");

            // Upload Image
            const fileName = Date.now() + "_" + file.name;
            const { data: stData, error: stErr } = await _supabase.storage
                .from('fashion-images')
                .upload(fileName, file);

            if(stErr) return alert("Storage Error: " + stErr.message);

            // Get Link
            const { data: urlData } = _supabase.storage.from('fashion-images').getPublicUrl(fileName);

            // Save Row
            const { error: dbErr } = await _supabase.from('products').insert([
                { name, price: parseInt(price), section, description: desc, image_url: urlData.publicUrl }
            ]);

            if(!dbErr) {
                alert("GZ8 DROP SUCCESSFUL!");
                location.reload();
            } else {
                alert("DB Error: " + dbErr.message);
            }
        }

        // 6. DELETE LOGIC
        async function deleteProduct(id) {
            if(!confirm("Remove this drop?")) return;
            const { error } = await _supabase.from('products').delete().eq('id', id);
            if(!error) loadGZ8Products();
        }

        // Init
        document.addEventListener('DOMContentLoaded', loadGZ8Products);
    </script>
</body>
</html>
