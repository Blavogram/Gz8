<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>GZ8 STUDIO</title>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow+Condensed:wght@700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { --red: #E8002D; --black: #080808; --white: #F4F0E8; }
        body { background: var(--black); color: var(--white); font-family: 'Barlow Condensed', sans-serif; margin: 0; }
        nav { display: flex; justify-content: space-between; padding: 20px; border-bottom: 1px solid #222; sticky: top; background: var(--black); }
        .logo { font-family: 'Bebas Neue'; font-size: 32px; letter-spacing: 2px; }
        .logo span { color: var(--red); }
        .admin-panel { padding: 40px; max-width: 500px; margin: auto; display: none; }
        .shop-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 20px; padding: 20px; }
        .card { background: #111; border: 1px solid #222; padding: 10px; }
        .card img { width: 100%; height: 300px; object-fit: cover; }
        input, select { width: 100%; padding: 10px; margin: 10px 0; background: #000; color: #fff; border: 1px solid #333; }
        button { width: 100%; padding: 15px; background: var(--red); color: white; border: none; font-weight: bold; cursor: pointer; }
        .nav-btn { background: none; border: 1px solid #333; width: auto; padding: 5px 15px; }
    </style>
</head>
<body>

    <nav>
        <div class="logo">GZ<span>8</span> STUDIO</div>
        <div>
            <button class="nav-btn" onclick="toggleAdmin(false)">SHOP</button>
            <button class="nav-btn" onclick="toggleAdmin(true)">ADMIN</button>
        </div>
    </nav>

    <div id="admin-ui" class="admin-panel">
        <h2>UPLOAD NEW DROP</h2>
        <input type="text" id="name" placeholder="ITEM NAME">
        <input type="number" id="price" placeholder="PRICE (KSH)">
        <input type="file" id="image">
        <button id="uploadBtn" onclick="upload()">PUSH TO CLOUD</button>
    </div>

    <div id="shop-ui" class="shop-grid"></div>

    <script>
        // REPLACE THESE WITH YOUR ACTUAL KEYS FROM SUPABASE SETTINGS
        const S_URL = 'https://cegqucyibtgddntbwahn.supabase.co';
        const S_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNlZ3F1Y3lpYnRnZGRudGJ3YWhuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzgxMzY5MzIsImV4cCI6MjA5MzcxMjkzMn0.mxsdS_P_Dpsl9s6qHScBEo5ZEVl4linidceLifUFqHE';
        const _sb = supabase.createClient(S_URL, S_KEY);

        function toggleAdmin(show) {
            document.getElementById('admin-ui').style.display = show ? 'block' : 'none';
            document.getElementById('shop-ui').style.display = show ? 'none' : 'grid';
        }

        async function load() {
            const { data } = await _sb.from('products').select('*');
            const grid = document.getElementById('shop-ui');
            grid.innerHTML = data.map(p => `
                <div class="card">
                    <img src="${p.image_url}">
                    <h3>${p.name}</h3>
                    <p>KSH ${p.price}</p>
                </div>
            `).join('');
        }

        async function upload() {
            const btn = document.getElementById('uploadBtn');
            const file = document.getElementById('image').files[0];
            const name = document.getElementById('name').value;
            const price = document.getElementById('price').value;

            if (!file || !name) return alert("Fill everything!");
            btn.innerText = "UPLOADING...";

            // 1. Upload Image
            const fName = Date.now() + "_" + file.name;
            await _sb.storage.from('fashion-images').upload(fName, file);
            const { data: urlObj } = _sb.storage.from('fashion-images').getPublicUrl(fName);

            // 2. Save to Table
            await _sb.from('products').insert([{ name, price, image_url: urlObj.publicUrl }]);
            
            alert("DROP SUCCESSFUL!");
            location.reload();
        }

        load();
    </script>
</body>
</html>
